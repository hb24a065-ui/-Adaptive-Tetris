:root[data-theme="dark"]{--bg:#12162b;--panel:#1b2140;--ink:#e8ebfa;--sub:#98a0c4;--well:#0e1226;--grid:rgba(232,235,250,.06);--line:#2b3360;--help:#4cc9c0;--hard:#f0726b;--accent:#8196ff;--on-accent:#0e1226;color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px}
h1{font-family:"DotGothic16","Zen Maru Gothic",sans-serif;font-weight:400;font-size:1.6rem;margin:4px 0 2px;letter-spacing:.04em}
.lead{color:var(--sub);font-size:.85rem;margin:0 0 14px;text-align:center}
.game{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;max-width:640px}
.stage{position:relative;width:min(300px,62vw);flex:0 0 auto}
#board{width:100%;display:block;background:var(--well);border:2px solid var(--line);border-radius:10px}

@keyframes pl{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--hard) 45%,transparent)}}
#ban{position:absolute;left:2px;right:2px;top:2px;text-align:center;font-family:"DotGothic16",sans-serif;font-size:1.05rem;padding:6px;background:color-mix(in srgb,var(--panel) 40%,transparent);text-shadow:0 1px 3px color-mix(in srgb,var(--panel) 90%,transparent);border-radius:8px 8px 0 0;pointer-events:none;opacity:0}
#ban.on{animation:bn 1.7s ease-out}
@keyframes bn{0%{opacity:0;transform:translateY(-8px)}12%{opacity:.85;transform:none}75%{opacity:.85}100%{opacity:0}}
.panel{flex:1 1 200px;min-width:190px;max-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:.72rem;color:var(--sub);margin-bottom:4px}.lbl b{color:var(--accent)}
#next,#hold{width:100%;max-width:90px;background:var(--well);border-radius:8px;border:1px solid var(--line);display:block}
.cdbar{height:4px;max-width:90px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}.cdbar i{display:block;height:100%;width:0;background:var(--accent)}
.pieces{display:flex;gap:12px;align-items:flex-start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;text-align:center}
.stats b{display:block;font-family:"DotGothic16",sans-serif;font-weight:400;font-size:1.15rem}
#cc{font-family:"DotGothic16",sans-serif;color:var(--accent);min-height:1.2em;font-size:.9rem}
.gauge{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--help),var(--line) 50%,var(--hard))}
.gauge i{position:absolute;top:-4px;width:6px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-3px);transition:left .5s}
.gl{display:flex;justify-content:space-between;font-size:.7rem;color:var(--sub);margin-top:4px}
#mode{font-weight:700;font-size:.95rem}
#cd{font-size:.76rem;font-weight:700;min-height:1.2em;display:flex;flex-direction:column;gap:2px}
#kinfo{font-size:.78rem;color:var(--sub)}
#log{font-size:.78rem;color:var(--sub);min-height:3.2em;line-height:1.5}
.cover{position:absolute;inset:0;border-radius:10px;background:color-mix(in srgb,var(--bg) 90%,transparent);display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px;overflow-y:auto;z-index:5}
.pane{width:100%;margin:auto 0;display:flex;flex-direction:column;gap:9px;align-items:center}
.pane h2{font-family:"DotGothic16",sans-serif;font-weight:400;margin:0;font-size:1.35rem}
.pane p{margin:0;font-size:.8rem;color:var(--sub);line-height:1.6}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
select.sec{font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;border-radius:10px}
.credit{font-size:.72rem;color:var(--sub);margin-top:8px;text-align:center}
.modes{display:flex;flex-direction:column;gap:8px;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);padding:10px 20px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mb{width:100%;text-align:left;padding:10px 14px}.mb small{display:block;font-weight:500;font-size:.72rem;opacity:.9;margin-top:2px;line-height:1.4}
.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px 14px;font-size:.85rem}
.sr{width:100%;font-size:.76rem;text-align:left;display:block}.sr span{display:flex;justify-content:space-between;color:var(--sub);margin-bottom:2px}.sr b{color:var(--ink)}.sr input[type=range]{width:100%;accent-color:var(--accent)}
#tg{width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--well);color:var(--ink)}
.ck{display:flex;gap:8px;align-items:center;font-size:.78rem;text-align:left}
.how{text-align:left;font-size:.76rem;line-height:1.65;width:100%}.how h3{margin:10px 0 2px;font-size:.85rem;color:var(--accent)}.how p,.how ul{margin:0 0 4px;color:var(--ink)}.how ul{padding-left:1.1em}
.pad{display:none;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.pad button{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:14px 16px;min-width:56px;font-size:1.1rem;touch-action:manipulation}
@media (pointer:coarse){.pad{display:flex}}
.keys{font-size:.75rem;color:var(--sub);margin-top:12px;text-align:center;line-height:1.7}
@media (min-width:901px) and (pointer:fine){
 body{padding-top:22px}h1{font-size:2rem}.lead{font-size:.95rem}
 .game{max-width:980px;gap:28px;flex-wrap:nowrap}
 .stage{width:min(420px,calc((100vh - 170px)/2))}
 .panel{flex:0 0 280px;max-width:280px;padding:18px;gap:14px}
 #next,#hold,.cdbar{max-width:110px}
}
@media (max-height:520px) and (min-width:701px){.stage{width:calc((100vh - 70px)/2)}}
@media (max-width:700px){
 body{padding:8px 8px 14px}h1{font-size:1.2rem;margin:0 0 6px}
 .lead,.keys,.gl,#log{display:none}
 .game{flex-wrap:nowrap;gap:8px}
 .stage{width:min(62vw,calc((100vh - 190px)/2));width:min(62vw,calc((100dvh - 190px)/2))}
 .panel{flex:1 1 0;min-width:0;max-width:none;padding:8px;gap:8px}
 .pieces{flex-direction:column;gap:6px}
 #next,#hold,.cdbar{max-width:64px}
 .stats b{font-size:.95rem}.lbl{font-size:.62rem}
 #mode{font-size:.8rem}#cd{font-size:.68rem}#kinfo{font-size:.68rem}
 .pad{display:flex;width:100%;max-width:440px;gap:6px}
 .pad button{flex:1;min-width:0;padding:14px 2px;font-size:.9rem}
 .cover{padding:10px}.pane h2{font-size:1.1rem}.pane p{font-size:.72rem}#ban{font-size:.85rem;padding:4px}
}
.gm{position:absolute;left:4px;bottom:4px;width:6px;height:0;max-height:calc(100% - 8px);background:var(--hard);border-radius:3px;opacity:.85;transition:height .25s;pointer-events:none}
.stage,.cstage{position:relative}
.cpuwrap{display:flex;flex-direction:column;gap:6px;width:min(210px,calc((100vh - 230px)/2*.72));order:3}
#cpuc{width:100%;display:block;background:var(--well);border:2px solid var(--line);border-radius:10px}
.cs{font-weight:700;font-size:.8rem}.cpuwrap .lbl{margin:0}.cpuwrap .lbl b{color:var(--hard)}
.pracopt{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (min-width:901px) and (pointer:fine){
 .game.vs{max-width:1240px}.game.vs .stage{width:min(360px,calc((100vh - 170px)/2))}
 .cpuwrap{width:min(300px,calc((100vh - 200px)/2))}
}
@media (max-width:700px){
 .game.vs{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:8px;align-items:start}
 .game.vs .stage{grid-row:1/3;width:min(58vw,calc((100vh - 190px)/2));width:min(58vw,calc((100dvh - 190px)/2))}
 .game.vs .panel{grid-column:2;grid-row:1;min-width:0}
 .game.vs .pieces{flex-direction:row}
 .game.vs .stats,.game.vs .gauge,.game.vs .gl,.game.vs #mode,.game.vs #ml,.game.vs #kinfo{display:none}
 .cpuwrap{grid-column:2;grid-row:2;width:100%;order:0;align-items:center}
 #cpuc{width:min(100%,104px)}.cstage{width:min(100%,104px)}
}
</style>

howT:['<h3>基本</h3><p>落ちてくるブロックを横一列に隙間なく並べると消えます。上まで積み上がるとゲームオーバーです。</p><h3>操作</h3><p>PC: ←→ 移動／↑・X 回転／Z 逆回転／↓ ソフトドロップ／Space ハードドロップ／C・Shift ホールド／P 一時停止<br>スマホ: 盤面の下のボタンで操作します。<br>PCのキーは、設定で変えられます。</p><h3>このゲームの特徴</h3><p>AIが「操作の速さ・穴の少なさ・積み高さ・消す効率・コンボ・チェイン」から腕前(0〜100)をリアルタイムで判定します。</p><ul><li><b>おじゃま</b>: 上手いと、下から穴あきの段が上がってきます。3ピース前からカウントで予告し、盤面が赤く点滅します。</li><li><b>お助け</b>: 苦戦すると、AIが盤面に合うピースを送ります。NEXTの「?」がお助けピースで、出現する瞬間に最適な形に決まります。置き場所は緑の点線で表示されます。</li><li>おじゃま／お助けの開始と終了は、画面中央に表示されます。</li></ul><h3>モード</h3><ul><li><b>エンドレス</b>: 耐久。1分ごとに難易度Lvが上がり、落下が速くなります。2分たつと、お助けのみでもおじゃまが入り始め、通常でもおじゃまが早まります（無限に耐えられないようにするため）。</li><li><b>スコアアタック</b>: 自分で決めた目標スコアに届くまでのタイムを競います。</li><li><b>練習</b>: おじゃま／お助けを自由にON・OFFでき、スピードも選べます。積み上がっても盤面がリセットされるだけです。</li></ul><p>エンドレスとスコアアタックでは、AIタイプ（通常／おじゃまのみ／お助けのみ）を選べます。</p><h3>コンボ・チェイン</h3><ul><li><b>コンボ</b>: ライン消しを連続で決めると増え、ボーナスが入ります。</li><li><b>チェイン</b>: 2段以上の消しを連続で決めると増え、大きなボーナスが入ります（1段消しで途切れます）。</li></ul><h3>ホールド</h3><p>ブロックを1つ取っておけます。一度使うと約10秒（設定で変更可）使えません。</p>',
'<h3>Basics</h3><p>Fill a horizontal row with no gaps to clear it. If the stack reaches the top, the game is over.</p><h3>Controls</h3><p>PC: ←→ move / ↑ or X rotate / Z rotate back / ↓ soft drop / Space hard drop / C or Shift hold / P pause<br>Mobile: use the buttons under the board.<br>PC keys can be changed in Settings.</p><h3>What makes it special</h3><p>The AI rates your skill (0–100) live, from your speed, how few holes you leave, stack height, clear efficiency, combos and chains.</p><ul><li><b>Garbage</b>: when you play well, rows with a hole rise from below. A countdown starts 3 pieces ahead and the board flashes red.</li><li><b>Help</b>: when you struggle, the AI sends a piece that fits your board. A “?” in NEXT is a help piece; its shape is chosen the moment it appears. A green dashed outline shows where to place it.</li><li>The start and end of each garbage or help phase is announced on screen.</li></ul><h3>Modes</h3><ul><li><b>Endless</b>: survival. Difficulty rises every minute and falling speeds up. After 2 minutes, garbage starts even in Help only, and comes sooner in Normal (so it cannot last forever).</li><li><b>Score Attack</b>: reach a target score you set, as fast as possible.</li><li><b>Practice</b>: toggle garbage and help freely. Pick a speed; topping out just resets the board.</li></ul><p>In Endless and Score Attack you can pick the AI type: Normal, Garbage only or Help only.</p><h3>Combo and Chain</h3><ul><li><b>Combo</b>: grows with consecutive line clears and gives a bonus.</li><li><b>Chain</b>: grows with consecutive clears of 2+ lines and gives a big bonus (a single clear breaks it).</li></ul><h3>Hold</h3><p>Stash one piece. After using it, it is locked for about 10 seconds (changeable in Settings).</p>']

ра»), вы соглашаетесь со следующим.</p><h3>1. Игра и трансляции</h3><ul><li>Личная некоммерческая игра бесплатна.</li><li>Трансляции и видео с игрой (в том числе монетизируемые) разрешены. Будем рады упоминанию названия Игры.</li></ul><h3>2. Права</h3><ul><li>Концепция, идеи, название и дизайнерские замыслы Игры принадлежат её автору замысла (оператору).</li><li>Игра создана с помощью ИИ Claude (Anthropic).</li></ul><h3>3. Запрещено</h3><ul><li>Извлекать, копировать, изменять, распространять, повторно использовать или декомпилировать HTML, код, изображения и тексты, а также переносить их на другие сервисы.</li><li>Использовать Игру или её подделки для политической деятельности или агитации, а также для поддержки терроризма, насилия, дискриминации и незаконных действий.</li><li>Атаковать сайт или серверы, получать несанкционированный доступ, а также иные нарушения.</li><li>Выдавать себя за оператора или третьих лиц.</li></ul><h3>4. Данные</h3><ul><li>Игра не собирает персональные данные. Настройки, язык и рекорды хранятся только в вашем браузере.</li></ul><h3>5. Отказ от ответственности и изменения</h3><ul><li>Игра предоставляется «как есть», без гарантий. Оператор не отвечает за ущерб от использования.</li><li>Условия и Игра могут быть изменены или прекращены без уведомления.</li><li>При нарушении доступ может быть ограничен, а публикация снята.</li></ul><p>Примечание: перевод выполнен ИИ. Оригинал — японская версия; при расхождениях она имеет приоритет.</p>',howVs:'<h3>Бой с CPU</h3><ul><li>Очистка линий посылает помехи: 2 линии = 1, 3 = 2, 4 = 4, плюс бонусы за комбо и цепи.</li><li>Присланные вам помехи копятся в красной полосе у поля; очищайте линии, чтобы погасить их. Если не очистили, они поднимутся разом.</li><li>Проигрывает тот, кто заполнит поле первым. CPU тоже получает помощь и помехи. Уровень CPU: 1–5.</li><li>Показывается положение вас и CPU (Преимущество / Равный бой / Опасно) по высоте стопки и входящим помехам.</li></ul><h3>Меню паузы в тренировке</h function buildSet(){const box=$('sl');box.innerHTML='';SET.forEach(([k,n,a,b,f])=>{const l=document.createElement('label');l.className='sr';l.innerHTML='<span>'+t(n)+'<b></b></span><input type="range" min="'+a+'" max="'+b+'" step="'+(b>10?5:1)+'">';const i=l.querySelector('input'),o=l.querySelector('b');i.value=S[k];o.textContent=f(S[k]);i.oninput=()=>{S[k]=+i.value;o.textContent=f(S[k]);saveS()};box.appendChild(l)});buildKeys();$('thSel').value=S.theme}

/* ---------- key config & theme ---------- */
const ACTS=[['left','kLeft'],['right','kRight'],['down','kDown'],['hard','kHard'],['rot','kRot'],['rotb','kRotb'],['hold','kHold'],['pause','kPause']];
const defKeys=()=>({left:['ArrowLeft',''],right:['ArrowRight',''],down:['ArrowDown',''],hard:[' ',''],rot:['ArrowUp','x'],rotb:['z',''],hold:['c','Shift'],pause:['p','']});
let KEYS=defKeys();try{const k=JSON.parse(localStorage.getItem('adt-keys')||'null');if(k)for(const a in KEYS)if(Array.isArray(k[a]))KEYS[a]=[k[a][0]||'',k[a][1]||'']}catch(e){}
function saveK(){try{localStorage.setItem('adt-keys',JSON.stringify(KEYS))}catch(e){}}
const nk=k=>k.length===1?k.toLowerCase():k;
const kd=k=>!k?'—':k===' '?'Space':({ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓'}[k]||(k.length===1?k.toUpperCase():k));
function actOf(k){for(const [a] of ACTS)if(KEYS[a].includes(k))return a;return null}
function keysLine(){return ACTS.map(([a,n])=>t(n)+' '+(KEYS[a].filter(x=>x).map(kd).join('/')||'—')).join(' ｜ ')}
let capA=null,capI=0;
function buildKeys(){const box=$('kc');box.innerHTML='';
  ACTS.forEach(([a,n])=>{const r=document.createElement('div');r.style.cssText='display:flex;align-items:center;gap:6px;font-size:.76rem';
    const sp=document.createElement('span');sp.style.cssText='flex:1;text-align:left';sp.textContent=t(n);r.appendChild(sp);
    [0,1].forEach(i=>{const b=document.createElement('button');b.className='sec';b.style.cssText='min-width:68px;padding:6px 8px';
      b.textContent=(capA===a&&capI===i)?t('kcPress'):kd(KEYS[a][i]);b.onclick=()=>{capA=a;capI=i;buildKeys()};r.appendChild(b)});
    box.appendChild(r)});
  const kl=document.querySelector('.keys');if(kl)kl.textContent=keysLine()}
addEventListener('keydown',e=>{if(!capA)return;e.preventDefault();e.stopImmediatePropagation();const k=nk(e.key);
  if(k==='Escape'){capA=null;buildKeys();return}
  if(k==='Backspace'||k==='Delete'){KEYS[capA][capI]='';capA=null;saveK();buildKeys();return}
  for(const a in KEYS)KEYS[a]=KEYS[a].map(x=>x===k?'':x);
  KEYS[capA][capI]=k;capA=null;saveK();buildKeys()},true);
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme==='dark'?'dark':'light');readTheme()}

/* ---------- state ---------- */
let board,cur,queue=[],bag=[],hint,score=0,lines=0,level=1,skill=40,state='idle',dropAcc=0,last=0,spawnT=0,hist=[],garbageCount=0,soft=false,logT,hold=null,holdLeft=0,hd=false,kind='endless',ai='normal',subKind='endless',target=S.target,elapsed=0,tl=0,combo=0,chain=0,helpCount=0,ph={g:false,h:false},pHint=true,pG=false,pH=false,cpu=null,cpuLv=3,pendP=0,vsSent=0,vsRecv=0,vsLast=null,vsBanT=-9999,pLevel=3,prev='p-title';

function newBoard(){return Array.from({length:H},()=>Array(W).fill(0))}
function fits(b,m,x,y){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){if(!m[r][c])continue;const bx=x+c,by=y+r;if(bx<0||bx>=W||by>=H)return false;if(by>=0&&b[by][bx])return false}return true}
function drop(b,m,x){let y=-2;if(!fits(b,m,x,y))return null;while(fits(b,m,x,y+1))y++;return y}
function put(b,m,x,y,v){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]&&y+r>=0)b[y+r][x+c]=v}
function clearLines(b){let n=0;for(let r=H-1;r>=0;r--){if(b[r].every(v=>v)){b.splice(r,1);b.unshift(Array(W).fill(0));n++;r++}}return n}
function metrics(b){const h=Array(W).fill(0);let holes=0;for(let c=0;c<W;c++){let seen=false;for(let r=0;r<H;r++){if(b[r][c]){if(!seen){h[c]=H-r;seen=true}}else if(seen)holes++}}
  let bump=0;for(let c=0;c<W-1;c++)bump+=Math.abs(h[c]-h[c+1]);return{h,holes,bump,agg:h.reduce((a,v)=>a+v,0),max:Math.max(...h)}}

function bestPlacement(b,ty){let best=null,m=SH[ty];
  for(let rot=0;rot<4;rot++){
    for(let x=-2;x<W;x++){const y=drop(b,m,x);if(y===null)continue;
      const cp=b.map(r=>r.slice());put(cp,m,x,y,1);const n=clearLines(cp);const k=metrics(cp);
      const s=-0.51*k.agg+0.76*n*3-0.36*k.holes*3-0.18*k.bump;
      if(!best||s>best.s)best={s,m,x,y,rot}}
    m=rotCW(m)}
  return best}
function chooseHelper(b){b=b||board;let bt=null,bs=-1e9;for(const ty of TY){const p=bestPlacement(b,ty);if(p&&p.s>bs){bs=p.s;bt=ty}}return bt||TY[0]}

/* ---------- AI rules ---------- */
function rating(){return clamp(skill+Math.min(combo,5)*2+Math.min(chain,4)*3,0,100)}
function helpLimit(){return ai==='help'?S.helpLine+15:S.helpLine}
function helpOn(){return kind==='practice'?pH:(ai!=='garbage'&&rating()<helpLimit())}
function hintOn(){return S.hintV&&(kind==='practice'?pHint:(ai!=='garbage'&&rating()<helpLimit()-5))}
function garbageOn(){return kind==='practice'?pG:(ai==='garbage'||(ai==='normal'&&(rating()>S.garbageLine||(kind==='endless'&&tl>=2)))||(kind==='endless'&&ai==='help'&&tl>=2))}
function garbageNeed(){if(!garbageOn())return 99;const b=(ai==='garbage'||kind==='practice')?16-rating()*0.1:14-Math.max(0,rating()-S.garbageLine)*0.2;return Math.max(2,Math.round(b*3/S.garbageFreq/(1+tl*(ai==='garbage'?0.15:0.2))*(kind==='vs'?2:1)))}
function garbageRows(){return Math.min(4,S.garbageRows+Math.floor(tl/4))}
function helpNeed(){return Math.max(2,Math.round((2+Math.min(1,rating()/helpLimit())*4)*3/S.helpFreq*(1+tl*0.2)))}

function refillBag(){bag=TY.slice();for(let i=6;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
function nextItem(){if(helpOn()&&++helpCount>=helpNeed()){helpCount=0;return{t:'T',h:true}}
  if(!bag.length)refillBag();return{t:bag.pop(),h:false}}
function fillQueue(){while(queue.length<4)queue.push(nextItem())}
function say(s){$('log').textContent=s;clearTimeout(logT);logT=setTimeout(()=>{$('log').textContent=''},4500)}
function banner(s,c){const b=$('ban');b.textContent=s;b.style.color=c;b.classList.remove('on');void b.offsetWidth;b.classList.add('on')}

function ann(s,c){if(S.ann){banner(s,c);say(s)}}
function spawn(){const it=queue.shift();fillQueue();place(it)}
function place(it){
  if(it.h&&!it.r)it={t:chooseHelper(),h:true,r:1};
  cur={t:it.t,m:SH[it.t].map(r=>r.slice()),x:Math.floor((W-SH[it.t][0].length)/2),y:-1,helper:it.h};
  if(it.h&&S.ann)say(t('helpMsg'));
  spawnT=elapsed;dropAcc=0;
  if(!fits(board,cur.m,cur.x,cur.y)){if(kind==='practice'){board=newBoard();say(t('reset'))}else{end(false);return}}
  hint=null;if(hintOn()){const p=bestPlacement(board,cur.t);if(p)hint=p}
}

function lock(){
  put(board,cur.m,cur.x,cur.y,TY.indexOf(cur.t)+1);
  const fr=board.map((r,i)=>r.every(v=>v)?i:-1).filter(i=>i>=0);fxLock();
  const n=clearLines(board);
  if(n){combo++;chain=n>=2?chain+1:0;
    let pts=[0,100,300,500,800][n]*level;
    if(combo>1)pts+=50*(combo-1)*level;
    if(n>=2&&chain>1)pts+=200*(chain-1)*level;
    score+=pts;lines+=n;if(kind!=='practice')level=1+Math.floor(lines/10);fxClear(fr,combo,chain)}
  else combo=0;
  if(kind==='vs'){vsLock(n);if(state!=='play')return}
  const k=metrics(board);
  hist.push({dt:elapsed-spawnT,holes:k.holes,max:k.max,n,cb:combo,ch:chain});if(hist.length>10)hist.shift();
  updateSkill();checkPhase();
  if(kind==='attack'&&score>=target){end(true);return}
  garbageCount++;const need=garbageNeed();
  if(garbageCount>=need){garbageCount=0;addGarbage()}
  else if(garbageOn()&&S.warn){const rem=need-garbageCount;if(rem<=3){banner(t('wn',rem),theme.hard);cv.classList.toggle('warn',rem<=1)}}
  render_ui();if(state==='play')spawn()}

function updateSkill(){
  const a=f=>hist.reduce((s,e)=>s+f(e),0)/hist.length;
  const pps=1000/Math.max(300,a(e=>e.dt));
  const speed=clamp((pps-0.35)/1.1,0,1);
  const clean=1-clamp(hist[hist.length-1].holes/8,0,1);
  const safe=1-clamp((a(e=>e.max)-4)/12,0,1);
  const eff=clamp(a(e=>e.n)*3,0,1);
  const cmb=clamp(a(e=>Math.min(e.cb||0,4))/4,0,1),chn=clamp(a(e=>Math.min(e.ch||0,3))/3,0,1);
  const target=100*(0.22*speed+0.24*clean+0.16*safe+0.18*eff+0.12*cmb+0.08*chn);
  skill=clamp(skill+(target-skill)*0.2,0,100)}
function checkPhase(){const g=garbageOn(),h=helpOn();
  if(g!==ph.g){ph.g=g;const s=t(g?'gStart':'gEnd');ann(s,theme.hard)}
  if(h!==ph.h){ph.h=h;const s=t(h?'hStart':'hEnd');ann(s,theme.help)}}

function addGarbage(){cv.classList.remove('warn');let ok=true;for(let i=0;i<garbageRows();i++)if(!addG1()){ok=false;break}
  if(ok){if(S.ann){say(t('gMsg'));banner(t('gp'),theme.hard)}fxGarbage()}}
function addG1(){
  const k=metrics(board);let low=0;for(let c=1;c<W;c++)if(k.h[c]<k.h[low])low=c;
  const hole=low<W/2?W-1-Math.floor(Math.random()*3):Math.floor(Math.random()*3);
  const row=Array(W).fill(8);row[hole]=0;
  if(board[0].some(v=>v)){end(false);return false}
  board.shift();board.push(row);return true}

function gravity(){const b=Math.max(70,820-level*55);return kind==='practice'?b:Math.max(45,b*(1.3-skill/100*0.6)*Math.pow(ai==='garbage'?.95:ai==='normal'?.92:.9,tl))}
function tryMove(dx,dy){if(fits(board,cur.m,cur.x+dx,cur.y+dy)){cur.x+=dx;cur.y+=dy;return true}return false}
function rotate(dir){let m=cur.m;m=dir>0?rotCW(m):rotCW(rotCW(rotCW(m)));
  for(const dx of[0,-1,1,-2,2])for(const dy of[0,-1]){if(fits(board,m,cur.x+dx,cur.y+dy)){cur.m=m;cur.x+=dx;cur.y+=dy;return}}}
function hardDrop(){while(tryMove(0,1))score+=2;lock()}
function doHold(){if(holdLeft>0||!cur)return;const st=spawnT;const me={t:cur.t,h:cur.helper,r:1};let it;
  if(hold){it=hold}else{it=queue.shift();fillQueue()}
  hold=me;place(it);spawnT=st;holdLeft=kind==='practice'?0:S.holdCd*1000;render_ui()}
function act(a){if(state!=='play')return;
  if(a==='left')tryMove(-1,0);else if(a==='right')tryMove(1,0);
  else if(a==='down'){if(tryMove(0,1))score+=1}
  else if(a==='rot')rotate(1);else if(a==='rotb')rotate(-1);else if(a==='hard')hardDrop();else if(a==='hold')doHold();
  if(state==='play')draw()}

/* ---------- CPU battle ---------- */
const SUBK={endless:'mEnd',attack:'mAtk',vs:'mVs'};
const CPUMS=[0,1600,1050,720,480,300],CPUERR=[0,.4,.25,.12,.06,.03];
function calcSkill(hs,sk){const a=f=>hs.reduce((s,e)=>s+f(e),0)/hs.length;
  const pps=1000/Math.max(300,a(e=>e.dt)),speed=clamp((pps-0.35)/1.1,0,1),clean=1-clamp(hs[hs.length-1].holes/8,0,1),safe=1-clamp((a(e=>e.max)-4)/12,0,1),eff=clamp(a(e=>e.n)*3,0,1),cmb=clamp(a(e=>Math.min(e.cb||0,4))/4,0,1),chn=clamp(a(e=>Math.min(e.ch||0,3))/3,0,1);
  const tg=100*(0.22*speed+0.24*clean+0.16*safe+0.18*eff+0.12*cmb+0.08*chn);return clamp(sk+(tg-sk)*0.2,0,100)}
function crate(){const c=cpu;return clamp(c.sk+Math.min(c.combo,5)*2+Math.min(c.chain,4)*3,0,100)}
function cHelpOn(){return ai!=='garbage'&&crate()<helpLimit()}
function cGarbOn(){return ai==='garbage'||(ai==='normal'&&crate()>S.garbageLine)}
function cNeedH(){return Math.max(2,Math.round((2+Math.min(1,crate()/helpLimit())*4)*3/S.helpFreq))}
function cNeedG(){const b=ai==='garbage'?16-crate()*0.1:14-Math.max(0,crate()-S.garbageLine)*0.2;return Math.max(2,Math.round(b*3/S.garbageFreq*2))}
function atkOf(n,cb,ch){let a=[0,0,1,2,4][n];if(cb>=2)a+=Math.min(4,Math.floor(cb/2));if(n>=2&&ch>1)a+=Math.min(3,ch-1);return a}
function pushRows(b,n){const hole=Math.floor(Math.random()*W);for(let i=0;i<n;i++){if(b[0].some(v=>v))return false;const row=Array(W).fill(8);row[hole]=0;b.shift();b.push(row)}return true}
function allPlace(b,ty){const out=[];let m=SH[ty];for(let rot=0;rot<4;rot++){for(let x=-2;x<W;x++){const y=drop(b,m,x);if(y===null)continue;const cp=b.map(r=>r.slice());put(cp,m,x,y,1);const n=clearLines(cp);const k=metrics(cp);out.push({s:-0.51*k.agg+0.76*n*3-0.36*k.holes*3-0.18*k.bump,m,x,y})}m=rotCW(m)}return out}
function vsReset(){pendP=0;vsSent=0;vsRecv=0;vsLast=null;$('gmP').style.height='0';cpu=null;if(kind!=='vs')return;
  cpu={b:newBoard(),bag:[],cur:null,pl:null,tm:0,wait:0,pt:0,combo:0,chain:0,pend:0,hist:[{dt:1500,holes:0,max:2,n:0,cb:0,ch:0}],sk:40,gc:0,hc:0,fl:[]};cpuSpawn()}
function cpuNext(){const c=cpu;if(cHelpOn()&&++c.hc>=cNeedH()){c.hc=0;return chooseHelper(c.b)}
  if(!c.bag.length)c.bag=TY.slice().sort(()=>Math.random()-.5);return c.bag.pop()}
function cpuPlan(ty){const ls=allPlace(cpu.b,ty);if(!ls.length)return null;const nz=[0,3,2,1.2,.6,.3][cpuLv];ls.forEach(o=>o.s+=(Math.random()-.5)*nz);ls.sort((a,b)=>b.s-a.s);
  let i=0;if(Math.random()<CPUERR[cpuLv])i=1+Math.floor(Math.random()*Math.min(ls.length-1,6));return ls[i]||ls[0]}
function cpuSpawn(){const c=cpu,ty=cpuNext(),sx=Math.floor((W-SH[ty][0].length)/2);
  if(!fits(c.b,SH[ty],sx,-1)){cpuOut();return}
  const pl=cpuPlan(ty);if(!pl){cpuOut();return}
  c.cur={t:ty,x:sx};c.pl=pl;c.tm=0;c.wait=0;c.pt=0;c.dl=cpuDelay()}
function cpuOut(){cpu.cur=null;end(true)}
function cpuDelay(){const mn=20+(5-cpuLv)*15;
  let f=1.4-rating()/100;
  if(helpOn())f*=1.4;else if(garbageOn())f*=0.8;
  return Math.max(mn,[0,140,110,85,60,40][cpuLv]*f*(0.8+Math.random()*0.4))}
function cpuStep(dt){const c=cpu;if(!c.cur)return;
  c.fl.forEach(f=>f.l-=dt);c.fl=c.fl.filter(f=>f.l>0);
  c.pt+=dt;c.tm+=dt;
  let sm;while(c.cur&&c.tm>=(sm=Math.max(28,CPUMS[cpuLv]/9)+(c.dl||0))){c.tm-=sm;c.dl=cpuDelay();const u=c.cur,p=c.pl;
    if(u.x<p.x)u.x++;else if(u.x>p.x)u.x--;else if(c.wait<3)c.wait++;else cpuLock()}}
function cpuLock(){const c=cpu,p=c.pl,v=TY.indexOf(c.cur.t)+1;
  put(c.b,p.m,p.x,p.y,v);
  const fr=c.b.map((r,i)=>r.every(x=>x)?i:-1).filter(i=>i>=0);
  const n=clearLines(c.b);
  if(n){c.combo++;c.chain=n>=2?c.chain+1:0;fr.forEach(r=>c.fl.push({r,l:350}));
    const a=atkOf(n,c.combo,c.chain),k=Math.min(a,c.pend);c.pend-=k;const s=a-k;if(s>0)pendP=Math.min(20,pendP+s)}
  else{c.combo=0;if(c.pend>0){const r=pushRows(c.b,c.pend);c.pend=0;if(!r){cpuOut();return}}}
  const m=metrics(c.b);c.hist.push({dt:c.pt,holes:m.holes,max:m.max,n,cb:c.combo,ch:c.chain});if(c.hist.length>10)c.hist.shift();
  c.sk=calcSkill(c.hist,c.sk);
  c.gc++;if(cGarbOn()&&c.gc>=cNeedG()){c.gc=0;if(!pushRows(c.b,1)){cpuOut();return}}
  render_ui();cpuSpawn()}
function vsLock(n){
  if(n){const a=atkOf(n,combo,chain),k=Math.min(a,pendP);pendP-=k;const s=a-k;
    if(s>0){cpu.pend=Math.min(20,cpu.pend+s);vsSent+=s;say(t('vsSend',s))}}
  else if(pendP>0){const r=pendP;pendP=0;if(!pushRows(board,r)){end(false);return}vsRecv+=r;fxGarbage();if(S.ann)banner(t('vsRecv',r),theme.hard)}}
const SIT={ahead:['vsAhead','var(--help)','vsBanA'],close:['vsClose','var(--accent)','vsBanC'],pinch:['vsPinch','var(--hard)','vsBanP']};
function vsSit(){const hp=metrics(board).max+pendP*0.7,hc=metrics(cpu.b).max+cpu.pend*0.7,d=hc-hp;
  const f=(me,dd)=>me>=15?'pinch':dd>=4?'ahead':dd<=-4?'pinch':'close';return{p:f(hp,d),c:f(hc,-d)}}
function vsUI(){if(!cpu){$('vsSt').innerHTML='';return}
  $('gmP').style.height=Math.min(100,pendP/H*100)+'%';$('gmC').style.height=Math.min(100,cpu.pend/H*100)+'%';
  const st=vsSit(),sp=SIT[st.p],sc=SIT[st.c];
  $('cpuL').innerHTML='CPU Lv'+cpuLv+(S.sit?' <b style="color:'+sc[1]+'">'+t(sc[0])+'</b>':'')+(cpu.pend?' <b>🗑 '+cpu.pend+'</b>':'');
  $('vsSt').innerHTML=S.sit?t('vsYou')+'：<b style="color:'+sp[1]+'">'+t(sp[0])+'</b>':'';
  if(st.p!==vsLast){if(vsLast!==null&&S.sit&&state==='play'&&elapsed-vsBanT>3000){banner(t(sp[2]),st.p==='ahead'?theme.help:st.p==='pinch'?theme.hard:theme.accent);vsBanT=elapsed}vsLast=st.p}
  const s=$('cpuS');if(cHelpOn()){s.textContent=t('mHelp');s.style.color='var(--help)'}else if(cGarbOn()){s.textContent=t('mGarb');s.style.color='var(--hard)'}else{s.textContent=t('mOk');s.style.color='var(--ink)'}}
function drawCpu(){const c=cpu,g=cg;g.clearRect(0,0,300,600);g.strokeStyle=theme.grid;g.lineWidth=1;
  for(let i=1;i<W;i++){g.beginPath();g.moveTo(i*C,0);g.lineTo(i*C,600);g.stroke()}
  for(let i=1;i<H;i++){g.beginPath();g.moveTo(0,i*C);g.lineTo(300,i*C);g.stroke()}
  for(let r=0;r<H;r++)for(let q=0;q<W;q++)if(c.b[r][q])cell(g,q,r,c.b[r][q],C);
  if(c.cur&&c.pl){const v=TY.indexOf(c.cur.t)+1,m=c.pl.m;
    for(let r=0;r<m.length;r++)for(let q=0;q<m[r].length;q++)if(m[r][q]){if(c.pl.y+r>=0)cell(g,c.pl.x+q,c.pl.y+r,v,C,.2);cell(g,c.cur.x+q,r,v,C)}}
  c.fl.forEach(f=>{g.globalAlpha=f.l/350*.7;g.fillStyle='#f2c14e';g.fillRect(0,f.r*C,300,C)});g.globalAlpha=1}

/* ---------- effects ---------- */
const fx={p:[],f:[],t:[],sh:0,mag:0};
function fxActive(){return fx.p.length>0||fx.f.length>0||fx.t.length>0||fx.sh>0}
function burst(x,y,col,n,sp,up){if(!S.fx)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.3+Math.random())*sp,l=450+Math.random()*450;fx.p.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||0),l,m:l,c:col,s:2+Math.random()*3})}}
function fxLock(){if(!S.fx||!cur)return;
  for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++){if(!cur.m[r][c])continue;const x=(cur.x+c)*C,y=(cur.y+r)*C;
    fx.f.push({x,y,w:C,h:C,l:240,m:240,c:theme.ink,a:.35});
    if(!(cur.m[r+1]&&cur.m[r+1][c]))burst(x+C/2,y+C,theme.ink,3,.1,.02)}}
function fxClear(rows,cb,ch){if(!S.fx)return;const n=rows.length;
  rows.forEach(r=>{fx.f.push({x:0,y:r*C,w:300,h:C,l:380,m:380,c:'#f2c14e',a:.8});for(let c=0;c<W;c++)burst(c*C+C/2,r*C+C/2,COL[1+Math.floor(Math.random()*7)],n>=4?3:2,.18+n*.04,.05)});
  fx.sh=Math.max(fx.sh,120+n*60);fx.mag=Math.max(fx.mag,n*2);
  const y=rows[0]*C+10;
  if(n>=2)fx.t.push({s:t(['','','dbl','tri','tet'][n]),y,l:1000,c:theme.ink});
  if(cb>1)fx.t.push({s:t('combo',cb),y:y+30,l:1100,c:theme.help});
  if(ch>1&&n>=2)fx.t.push({s:t('chain',ch),y:y+60,l:1200,c:theme.accent});
  if(navigator.vibrate)try{navigator.vibrate(n*20)}catch(e){}}
function fxGarbage(){if(!S.fx)return;const h=theme.hard;
  fx.f.push({x:0,y:0,w:300,h:600,l:450,m:450,c:h,a:.2});fx.f.push({x:0,y:540,w:300,h:60,l:600,m:600,c:h,a:.6});
  for(let i=0;i<24;i++)burst(Math.random()*300,590,h,1,.2,.2);
  fx.sh=450;fx.mag=7}
function stepFx(d){fx.p.forEach(p=>{p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=.0007*d;p.l-=d});fx.p=fx.p.filter(p=>p.l>0);
  fx.f.forEach(f=>f.l-=d);fx.f=fx.f.filter(f=>f.l>0);fx.t.forEach(q=>{q.l-=d;q.y-=.03*d});fx.t=fx.t.filter(q=>q.l>0);
  if(fx.sh>0){fx.sh-=d;cv.style.transform='translate('+((Math.random()-.5)*fx.mag).toFixed(1)+'px,'+((Math.random()-.5)*fx.mag).toFixed(1)+'px)';if(fx.sh<=0){cv.style.transform='';fx.mag=0}}}
function drawFx(){if(!fxActive())return;
  fx.f.forEach(f=>{cx.globalAlpha=clamp(f.l/f.m,0,1)*f.a;cx.fillStyle=f.c;cx.fillRect(f.x,f.y,f.w,f.h)});
  fx.p.forEach(p=>{cx.globalAlpha=clamp(p.l/p.m*1.4,0,1);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});
  cx.textAlign='center';cx.font='26px DotGothic16, sans-serif';
  fx.t.forEach(q=>{cx.globalAlpha=clamp(q.l/400,0,1)*.75;cx.fillStyle=q.c;cx.fillText(q.s,150,q.y)});cx.globalAlpha=1}

/* ---------- drawing ---------- */
function cell(g,x,y,v,s,a){g.globalAlpha=a||1;g.fillStyle=COL[v];g.beginPath();g.roundRect(x*s+1.5,y*s+1.5,s-3,s-3,5);g.fill();
  g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x*s+4,y*s+4,s-8,4);g.globalAlpha=1}
function draw(){drawBase();drawFx();if(cpu)drawCpu()}
function drawBase(){
  cx.clearRect(0,0,300,600);cx.strokeStyle=theme.grid;cx.lineWidth=1;
  for(let i=1;i<W;i++){cx.beginPath();cx.moveTo(i*C,0);cx.lineTo(i*C,600);cx.stroke()}
  for(let i=1;i<H;i++){cx.beginPath();cx.moveTo(0,i*C);cx.lineTo(300,i*C);cx.stroke()}
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(board[r][c])cell(cx,c,r,board[r][c],C);
  if(!cur||state==='idle')return;
  if(hint){cx.strokeStyle=theme.help;cx.lineWidth=2;cx.setLineDash([5,4]);
    for(let r=0;r<hint.m.length;r++)for(let c=0;c<hint.m[r].length;c++)if(hint.m[r][c])cx.strokeRect((hint.x+c)*C+4,(hint.y+r)*C+4,C-8,C-8);cx.setLineDash([])}
  const gy=drop(board,cur.m,cur.x),v=TY.indexOf(cur.t)+1;
  if(gy!==null)for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++)if(cur.m[r][c]&&gy+r>=0)cell(cx,cur.x+c,gy+r,v,C,.18);
  for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++)if(cur.m[r][c]&&cur.y+r>=0)cell(cx,cur.x+c,cur.y+r,v,C);
}
function drawNext(){nx.clearRect(0,0,90,150);const s=18;
  queue.slice(0,3).forEach((it,i)=>{
    if(it.h){nx.strokeStyle=theme.help;nx.fillStyle=theme.help;nx.lineWidth=2;nx.setLineDash([4,3]);nx.strokeRect(13,i*54+6,64,42);nx.setLineDash([]);nx.font='26px DotGothic16, sans-serif';nx.textAlign='center';nx.fillText('?',45,i*54+36);return}
    const m=SH[it.t],v=TY.indexOf(it.t)+1,ox=(90-m[0].length*s)/2/s;
    for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c])cell(nx,ox+c,i*3+0.5+r,v,s)})}
function drawHold(){hx.clearRect(0,0,90,60);if(!hold)return;const s=18,m=SH[hold.t],v=TY.indexOf(hold.t)+1,ox=(90-m[0].length*s)/2/s,oy=(60/s-m.length)/2;
  for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c])cell(hx,ox+c,oy+r,v,s,holdLeft>0?.35:1)}
function fmt(ms){const s=ms/1000,m=Math.floor(s/60),r=s%60;return m+':'+(kind==='attack'?(Math.floor(r*10)/10).toFixed(1).padStart(4,'0'):String(Math.floor(r)).padStart(2,'0'))}
function render_ui(){
  $('sc').textContent=score;$('ln').textContent=lines;$('lv').textContent=level;$('mk').style.left=rating()+'%';
  const m=$('mode'),idle=state==='idle';
  if(kind==='practice'&&!idle){m.textContent=t('prac');m.style.color='var(--ink)'}
  else if(helpOn()){m.textContent=t('mHelp');m.style.color='var(--help)'}
  else if(garbageOn()){m.textContent=t('mGarb');m.style.color='var(--hard)'}
  else{m.textContent=ai==='help'&&!idle?t('mStby'):t('mOk');m.style.color='var(--ink)'}
  $('ml').textContent=t('aiL')+'（'+(kind==='practice'?t('mPrac'):t({normal:'aiN',garbage:'aiG',help:'aiH'}[ai]))+'）';
  $('kinfo').textContent=idle?'':kind==='attack'?t('kAtk',target,Math.max(0,target-score)):kind==='endless'?t('kEnd',tl+1):kind==='vs'?t('kVs',cpuLv):t('kPrac');
  let c='';
  if(!idle){
    if(garbageOn()&&S.warn)c+='<span style="color:var(--hard)">'+t('cdG',Math.max(1,garbageNeed()-garbageCount))+'</span>';
    const hi=queue.findIndex(q=>q.h);if(hi>=0&&S.ann)c+='<span style="color:var(--help)">'+t('cdH',hi+1)+'</span>';if(kind==='vs'&&pendP>0&&S.warn)c+='<span style="color:var(--hard)">'+t('vsInc',pendP)+'</span>'}
  $('cd').innerHTML=c;
  $('cc').textContent=(combo>1?t('combo',combo):'')+(chain>1?'  '+t('chain',chain):'');
  drawNext();drawHold();vsUI()}
function tick(){$('tm').textContent=fmt(elapsed);
  const cd=S.holdCd*1000;$('hcd').style.width=(holdLeft>0&&cd?holdLeft/cd*100:0)+'%';$('hs').textContent=holdLeft>0?Math.ceil(holdLeft/1000)+'s':'';
  const dm=holdLeft>0;if(dm!==hd){hd=dm;drawHold()}}

/* ---------- loop ---------- */
function loop(ts){
  const dt=Math.min(50,ts-(last||ts));last=ts;
  if(state==='play'){
    elapsed+=dt;if(holdLeft>0)holdLeft=Math.max(0,holdLeft-dt);if(cpu)cpuStep(dt);
    const ntl=kind==='endless'?Math.floor(elapsed/60000):0;
    if(ntl!==tl){tl=ntl;ann(t('lvUp',tl+1),theme.hard);render_ui()}
    dropAcc+=dt;if(state==='play'&&dropAcc>=(soft?40:gravity())){dropAcc=0;if(!tryMove(0,1))lock()}
    if(state==='play')draw();tick()}
  const was=fxActive();stepFx(dt);if(state!=='play'&&(was||fxActive()))draw();
  requestAnimationFrame(loop)}

/* ---------- screens ---------- */
const panes=()=>[...document.querySelectorAll('.pane')];
function show(id){panes().forEach(p=>p.hidden=p.id!==id);$('cover').hidden=false;if(id==='p-set')buildSet()}
function curPane(){const p=panes().find(p=>!p.hidden);return p?p.id:'p-title'}
function openP(id){prev=curPane();show(id)}
function applyLang(){document.documentElement.lang=L;document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=t(e.dataset.i));
  document.querySelectorAll('.lg').forEach(b=>b.value=L);document.querySelector('.keys').textContent=keysLine();
  $('hw').innerHTML=t('howT')+t('howVs');$('tw').innerHTML=t('termsT')+'<p><b>企画者・運営者 / Planner and Operator: hb24a065-ui</b><br>© 2026 hb24a065-ui. All rights reserved.</p>';if(!$('p-set').hidden)buildSet();
  $('subT').textContent=t(SUBK[subKind]);render_ui()}
function end(win){state='over';cv.classList.remove('warn');let extra='';
  if(win&&kind==='attack'){const key='adt-b-'+target+'-'+ai;let b=0;try{b=+localStorage.getItem(key)||0}catch(e){}
    if(!b||elapsed<b){try{localStorage.setItem(key,elapsed)}catch(e){}extra='<br>'+t('newBest')}else extra='<br>'+t('best',fmt(b))}
  if(kind==='vs'){$('ovT').textContent=t(win?'vsWin':'vsLose');$('ovP').innerHTML=t('vsRes',vsSent,vsRecv,fmt(elapsed),cpuLv)}else{$('ovT').textContent=t(win?'clear':'over');$('ovP').innerHTML=t('res',score,lines,fmt(elapsed),Math.round(skill))+extra}
  show('p-over');render_ui();draw()}
function start(k,a){kind=k;if(a)ai=a;
  board=newBoard();queue=[];bag=[];score=0;lines=0;level=kind==='practice'?pLevel:1;skill=40;hist=[{dt:1500,holes:0,max:2,n:0}];
  garbageCount=0;soft=false;hold=null;holdLeft=0;elapsed=0;tl=0;combo=0;chain=0;helpCount=0;ph=kind==='practice'?{g:garbageOn(),h:helpOn()}:{g:false,h:false};
  fx.p=[];fx.f=[];fx.t=[];cv.classList.remove('warn');$('log').textContent='';
  $('game').classList.toggle('vs',kind==='vs');$('cpuwrap').hidden=kind!=='vs';vsReset();refillBag();fillQueue();state='play';$('cover').hidden=true;spawn();render_ui();draw();tick()}
function pause(){if(state==='play'){state='pause';const pr=kind==='practice';$('pracOpt').hidden=!pr;if(pr){$('pg2').checked=pG;$('ph2').checked=pH;$('pt2').checked=pHint}show('p-pause')}}
function pracHint(){hint=null;if(cur&&hintOn()){const p=bestPlacement(board,cur.t);if(p)hint=p}}
function pracChange(){pG=$('pg2').checked;pH=$('ph2').checked;pHint=$('pt2').checked;
  if(!pH)queue.forEach(q=>{if(q.h){q.h=false;if(!bag.length)refillBag();q.t=bag.pop()}});
  ph={g:garbageOn(),h:helpOn()};garbageCount=0;pracHint();render_ui();draw()}
function resume(){if(state==='pause'){state='play';$('cover').hidden=true}}
function toTitle(){state='idle';cpu=null;pendP=0;$('game').classList.remove('vs');$('cpuwrap').hidden=true;$('gmP').style.height='0';board=newBoard();queue=[];hold=null;holdLeft=0;cur=null;hint=null;score=0;lines=0;level=1;skill=40;elapsed=0;tl=0;combo=0;chain=0;
  cv.classList.remove('warn');$('log').textContent='';render_ui();draw();tick();show('p-title')}

document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
  if(k==='practice'){$('plv').textContent=$('pl').value;show('p-prac')}
  else{subKind=k;$('subT').textContent=t(SUBK[k]);$('tgw').hidden=k!=='attack';$('lvw').hidden=k!=='vs';$('cl').value=cpuLv;$('clv').textContent=cpuLv;$('tg').value=S.target;show('p-sub')}});
document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{
  if(subKind==='attack'){S.target=Math.max(100,+$('tg').value||5000);target=S.target;saveS()}
  if(subKind==='vs')cpuLv=+$('cl').value;
  start(subKind,b.dataset.ai)});
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));
$('pl').oninput=()=>$('plv').textContent=$('pl').value;
$('cl').oninput=()=>$('clv').textContent=$('cl').value;
['pg2','ph2','pt2'].forEach(id=>$(id).onchange=pracChange);
$('rstB').onclick=()=>{board=newBoard();combo=0;chain=0;garbageCount=0;pracHint();say(t('reset'));render_ui();draw()};
$('pgo').onclick=()=>{pLevel=+$('pl').value;pHint=$('phint').checked;pG=$('pgc').checked;pH=$('phc').checked;start('practice')};
document.querySelectorAll('.hw').forEach(b=>b.onclick=()=>openP('p-how'));
document.querySelectorAll('.tm').forEach(b=>b.onclick=e=>{e.preventDefault();if(state==='play')pause();openP('p-terms')});
document.querySelectorAll('.st').forEach(b=>b.onclick=()=>openP('p-set'));
document.querySelectorAll('.cl').forEach(b=>b.onclick=()=>show(prev));
document.querySelectorAll('.tt').forEach(b=>b.onclick=toTitle);
document.querySelectorAll('.lg').forEach(b=>b.onchange=()=>{L=b.value;try{localStorage.setItem('adt-lang',L)}catch(e){}applyLang()});
$('sr').onclick=()=>{const tg=S.target;Object.assign(S,DEF);S.target=tg;saveS();KEYS=defKeys();saveK();applyTheme();draw();buildSet()};
$('thSel').onchange=()=>{S.theme=$('thSel').value;saveS();applyTheme();draw()};
$('rs').onclick=resume;$('rt').onclick=()=>start(kind);
$('menu').onclick=()=>{$('menu').blur();if(state==='play')pause();else if(state==='pause'){}else if(state==='over'||state==='idle'){toTitle()}};
addEventListener('keydown',e=>{const k=nk(e.key);
  if(e.target.tagName==='INPUT'&&state!=='play')return;
  const a=actOf(k);if(!a)return;
  if(state==='play')e.preventDefault();
  if(a==='pause'){if(state==='play')pause();else if(state==='pause'&&curPane()==='p-pause')resume();return}
  if(a==='down'){soft=true;return}
  act(a)});
addEventListener('keyup',e=>{if(actOf(nk(e.key))==='down')soft=false});
document.querySelectorAll('#pad button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.dataset.a==='pause')pause();else act(b.dataset.a)})});

applyTheme();applyLang();toTitle();requestAnimationFrame(loop);
})();
</script>
</body>
